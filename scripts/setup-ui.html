<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DriveLab 免费模型连接向导</title>
<style>
body{font:15px/1.8 'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#263b4b;margin:0}main{max-width:760px;margin:32px auto;background:white;padding:32px;border-radius:14px;border:1px solid #e1e7ed}h1{font-size:25px}h2{font-size:18px;margin-top:28px}a{color:#b74618}label{display:block;margin:19px 0}input,select{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #cbd5df;border-radius:6px;margin-top:6px;font-size:14px}button{background:#dc5e28;border:0;color:white;border-radius:6px;padding:12px 19px;cursor:pointer}button:disabled{opacity:.5}small{color:#617384}#status{white-space:pre-wrap;background:#f5f8fa;padding:16px;min-height:35px;border-radius:6px}.consent{display:flex;align-items:start;gap:8px}.consent input{width:auto;margin-top:7px}.steps{background:#fff8f1;border:1px solid #f0ddcc;border-radius:8px;padding:16px 22px}.steps ol{padding-left:22px}.steps li{margin:9px 0}.note{margin-top:6px}@media(max-width:600px){main{margin:10px;padding:20px}h1{font-size:22px}}
</style>
<main>
<small>DRIVELAB / 本机连接向导</small><h1>连接一个免费的真实模型</h1>
<p>访问令牌相当于密码：只填写在这个本机页面，不发到聊天，不截图，不提交 GitHub。</p>
<label>服务商<select id="provider"><option value="modelscope">魔搭 ModelScope 免费 API-Inference（优先）</option><option value="openrouter">OpenRouter 免费模型（备选）</option></select></label>
<div id="guide"></div><h2>2. 选择模型并测试</h2>
<form id="form">
<label>访问令牌<input id="key" type="password" autocomplete="off" placeholder="粘贴 ms- 开头的完整魔搭访问令牌" required></label>
<button type="button" id="models">查询当前免费模型</button>
<p class="note"><small>这是公开模型目录。查到模型只说明目录可访问，仍需点击下方按钮测试令牌。</small></p>
<label>模型<select id="model" required><option value="">先查询，再选择</option></select></label>
<label class="consent"><input type="checkbox" id="consent" checked><span>保存时用免费额度做一次连接测试（最多输出 128 tokens）。</span></label>
<label class="consent"><input type="checkbox" id="cloud"><span>授权把此配置用于我的 DriveLab 私有在线平台，供本项目分析调用。</span></label>
<button id="save">测试并保存免费模型配置</button></form>
<h2>连接结果</h2><div id="status" role="status" aria-live="polite">先完成官方账号绑定与认证，再填写令牌。</div>
<p><small>配置保存在项目忽略的 .dev.vars，只在服务端读取。向导仅使用免费入口，额度耗尽时停止，不自动切换付费。</small></p>
</main>
<script>
const token=__NONCE__,status=document.querySelector('#status'),provider=document.querySelector('#provider');
const key=document.querySelector('#key'),save=document.querySelector('#save'),catalog=document.querySelector('#models');
function guide(){
 document.querySelector('#guide').innerHTML=provider.value==='modelscope'
  ?'<h2>1. 完成官方账号准备（本人操作）</h2><div class="steps"><ol><li><a href="https://modelscope.cn/my/myaccesstoken" target="_blank" rel="noreferrer">打开魔搭个人中心 / 访问令牌</a>并登录。</li><li>按官方页面提示<strong>绑定阿里云账号并完成实名认证</strong>。若跳到阿里云，请在那里完成后返回魔搭。无需购买套餐、购买服务器或充值。</li><li>在“访问令牌”中复制<strong>ms- 开头的完整令牌内容</strong>，不要只复制名称，也不要复制阿里云 AccessKey 或百炼密钥。</li></ol><p>如果出现 HTTP 401，请先确认第 2 步已经完成，再检查令牌。查询模型目录成功不能证明认证已通过。</p></div>'
  :'<h2>1. 获取官方密钥（本人操作）</h2><div class="steps"><p><a href="https://openrouter.ai/settings/keys" target="_blank" rel="noreferrer">打开 OpenRouter 官方密钥页面</a>，登录后生成密钥。只使用带 :free 后缀的免费模型，额度以官方账户为准。</p></div>';
 key.placeholder=provider.value==='modelscope'?'粘贴 ms- 开头的完整魔搭访问令牌':'粘贴 OpenRouter 官方密钥';
}
 guide();
async function send(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error+(v.status?'\n诊断编号：HTTP '+v.status+' / '+v.reason:''));return v}
provider.onchange=()=>{document.querySelector('#model').replaceChildren(new Option('先查询，再选择',''));key.value='';guide()};
catalog.onclick=async()=>{
 catalog.disabled=true;save.disabled=true;
 try{status.textContent='正在读取免费模型公开目录…';const v=await send('/models',{provider:provider.value});const select=document.querySelector('#model');select.replaceChildren();const models=v.models.sort((a,b)=>Number(b.tools===true)-Number(a.tools===true)||a.id.localeCompare(b.id));for(const m of models){select.append(new Option(m.id+(m.tools?' · 支持工具调用':''),m.id))}const preferred=models.find(m=>/Qwen3\.(5|7|8).*27B|GLM-4.7-Flash|Qwen3.*30B/i.test(m.id));if(preferred)select.value=preferred.id;status.textContent='找到 '+models.length+' 个当前免费模型。\n尚未验证令牌：请在账号准备完成后，点击“测试并保存免费模型配置”。'}catch(e){status.textContent=e.message}finally{catalog.disabled=false;save.disabled=false}
};
document.querySelector('#form').onsubmit=async e=>{
 e.preventDefault();save.disabled=true;catalog.disabled=true;
 try{status.textContent='正在验证并保存…';const v=await send('/save',{provider:provider.value,key:key.value,model:document.querySelector('#model').value,test:document.querySelector('#consent').checked,cloud:document.querySelector('#cloud').checked});status.textContent=v.message;key.value=''}catch(e){status.textContent=e.message}finally{save.disabled=false;catalog.disabled=false}
};
</script></html>
